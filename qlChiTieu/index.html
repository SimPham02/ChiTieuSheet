<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #111726;
      --cell: #151d2e;
      --cell-hover: #1a2438;
      --cell-muted: #0d1320;
      --surface-soft: #1a2234;
      --line: #1e293b;
      --line-light: #283548;
      --text: #f1f5f9;
      --muted: #64748b;
      --muted-light: #94a3b8;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.16);
      --green: #34d399;
      --green-bg: rgba(16, 185, 129, 0.14);
      --green-border: rgba(16, 185, 129, 0.32);
      --red: #f87171;
      --red-bg: rgba(239, 68, 68, 0.14);
      --red-border: rgba(239, 68, 68, 0.32);
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; background: var(--bg); }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.08), transparent 45%), var(--bg);
      color: var(--text);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; color: inherit; }
    button { border: 0; cursor: pointer; background: none; }

    .app {
      max-width: 1140px;
      margin: 0 auto;
      padding: 22px 20px 48px;
    }

    /* ===== TOP BAR: NHẬP NHANH & TÓM TẮT ===== */
    .top-bar {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
      align-items: stretch;
    }

    .quick-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .quick-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .quick-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-glow);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .quick-input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 14px;
      color: var(--text);
      min-width: 0;
    }
    .quick-input::placeholder { color: var(--muted); }
    .quick-btn {
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 15px;
      border-radius: 10px;
      white-space: nowrap;
      transition: opacity .15s;
    }
    .quick-btn:hover { opacity: .92; }
    .quick-btn:disabled { opacity: .5; cursor: wait; }

    .summary-strip {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      align-items: center;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .stat-item:not(:first-child) {
      border-left: 1px solid var(--line);
      padding-left: 14px;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted-light);
      white-space: nowrap;
    }
    .stat-val {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-val.in { color: var(--green); }
    .stat-val.out { color: var(--red); }
    .stat-val.bal { color: #60a5fa; }

    /* ===== THANH ĐIỀU HƯỚNG LỊCH ===== */
    .nav-bar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--line-light);
      background: var(--cell);
      color: var(--muted-light);
      display: grid;
      place-items: center;
      font-size: 15px;
      transition: .16s ease;
    }
    .nav-icon-btn:hover {
      background: var(--cell-hover);
      color: var(--text);
      border-color: #3b4c66;
    }
    .nav-icon-btn.spinning { animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .month-title {
      font-size: 17px;
      font-weight: 800;
      min-width: 140px;
      text-align: center;
      letter-spacing: -0.2px;
    }
    .today-pill-btn {
      border: 1px solid var(--line-light);
      background: var(--cell);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      transition: .16s ease;
    }
    .today-pill-btn:hover {
      background: var(--cell-hover);
      border-color: var(--primary);
    }

    .view-tabs {
      display: inline-flex;
      background: #0b101b;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
    }
    .view-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted-light);
      transition: .16s ease;
    }
    .view-tab:hover { color: var(--text); }
    .view-tab.active {
      background: var(--surface-soft);
      color: var(--text);
      border: 1px solid var(--line-light);
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }

    /* ===== LỊCH THÁNG 7 CỘT ===== */
    .calendar-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 16px;
      transition: opacity .18s ease;
    }
    .calendar-card.is-loading {
      opacity: .55;
      pointer-events: none;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 10px;
      text-align: center;
    }
    .cal-weekday {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--muted-light);
      padding: 4px 0;
    }
    .cal-weekday.weekend { color: var(--red); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .cal-cell {
      background: var(--cell);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-md);
      min-height: 94px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
      position: relative;
      overflow: hidden;
      user-select: none;
    }
    .cal-cell:hover {
      background: var(--cell-hover);
      border-color: var(--line-light);
    }
    .cal-cell.other-month {
      background: var(--cell-muted);
      opacity: .42;
    }
    .cal-cell.today {
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.20) 0%, rgba(29, 78, 216, 0.08) 100%);
      border-color: #2563eb;
    }
    .cal-cell.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary) inset;
    }

    .cell-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-num {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .cal-cell.other-month .day-num { color: var(--muted); }
    .cal-cell.today .day-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: inline-grid;
      place-items: center;
      font-size: 12.5px;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.45);
    }
    .cell-count {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
    }

    .cell-pills {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-start;
    }
    .day-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }
    .day-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .day-pill.chi {
      background: var(--red-bg);
      border: 1px solid var(--red-border);
      color: var(--red);
    }
    .day-pill.chi .dot { background: var(--red); }
    .day-pill.thu {
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      color: var(--green);
    }
    .day-pill.thu .dot { background: var(--green); }

    /* ===== KHUNG CHI TIẾT NGÀY ĐANG CHỌN ===== */
    .day-detail-card, .view-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
    }
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .detail-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .detail-badges {
      display: flex;
      gap: 12px;
      font-size: 13px;
      font-weight: 800;
    }
    .detail-badges .in { color: var(--green); }
    .detail-badges .out { color: var(--red); }

    /* ===== DANH SÁCH GIAO DỊCH ===== */
    .tx-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 8px;
      border-bottom: 1px solid rgba(30, 41, 59, 0.65);
      border-radius: 10px;
      gap: 12px;
      transition: background .14s;
    }
    .tx-row:hover { background: var(--cell); }
    .tx-row:last-child { border-bottom: 0; }
    .tx-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      cursor: pointer;
      flex: 1;
    }
    .tx-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .tx-note {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--muted-light);
    }
    .tx-tag {
      background: var(--surface-soft);
      border: 1px solid var(--line-light);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 600;
    }
    .tx-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tx-amount {
      font-size: 13.5px;
      font-weight: 800;
      white-space: nowrap;
      margin-right: 4px;
    }
    .tx-amount.thu { color: var(--green); }
    .tx-amount.chi { color: var(--red); }

    .act-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 13px;
      transition: .14s;
    }
    .act-btn:hover { background: var(--surface-soft); color: var(--text); }
    .act-btn.del:hover { background: var(--red-bg); color: var(--red); }

    /* ===== TAB DANH SÁCH & THỐNG KÊ ===== */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .input-field {
      background: var(--cell);
      border: 1px solid var(--line-light);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .input-field:focus { border-color: var(--primary); }

    .stats-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
    }
    .cat-row {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 6px;
    }
    .cat-bar {
      height: 6px;
      background: var(--cell);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 5px;
    }
    .cat-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 99px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-content: start;
    }
    .kpi-box {
      background: var(--cell);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }
    .kpi-label { font-size: 11px; color: var(--muted-light); font-weight: 600; }
    .kpi-val { font-size: 17px; font-weight: 800; margin-top: 6px; }

    .empty {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ===== MODAL & TOAST ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--line-light);
      border-radius: 18px;
      padding: 22px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11.5px; color: var(--muted-light); font-weight: 700; margin-bottom: 6px; }
    .field .input-field { width: 100%; }
    .type-switch { display: flex; gap: 8px; }
    .type-opt {
      flex: 1;
      padding: 9px;
      border-radius: 9px;
      background: var(--cell);
      border: 1px solid var(--line-light);
      font-weight: 700;
      font-size: 13px;
    }
    .type-opt.active.chi { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }
    .type-opt.active.thu { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn-secondary, .btn-primary {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      text-align: center;
    }
    .btn-secondary { background: var(--cell); color: var(--muted-light); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:disabled { opacity: .5; cursor: wait; }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 50;
    }
    .toast.error { background: #7f1d1d; border-color: #b91c1c; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 860px) {
      .top-bar, .stats-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .app { padding: 14px 10px 36px; }
      .calendar-card { padding: 10px; }
      .cal-grid, .cal-weekdays { gap: 4px; }
      .cal-cell { min-height: 72px; padding: 6px 5px; border-radius: 9px; }
      .day-num { font-size: 12px; }
      .cal-cell.today .day-num { width: 22px; height: 22px; font-size: 11px; }
      .day-pill { padding: 2px 5px; font-size: 9.5px; gap: 3px; }
      .day-pill .dot { width: 5px; height: 5px; }
      .month-title { min-width: 115px; font-size: 15px; }
      .stat-val { font-size: 14px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- DẢI TRÊN: NHẬP NHANH & 3 CHỈ SỐ CỐT LÕI -->
  <div class="top-bar">
    <form class="quick-box" onsubmit="event.preventDefault(); submitQuickInput();">
      <div class="quick-icon">₫</div>
      <input id="quickInput" class="quick-input" autocomplete="off"
             placeholder="Nhập nhanh: 50k ăn sáng, 120k grab, thu 15tr lương...">
      <button type="submit" id="quickBtn" class="quick-btn">+ Lưu</button>
    </form>

    <div class="summary-strip">
      <div class="stat-item">
        <span class="stat-label">THU THÁNG NÀY</span>
        <span id="monthIncome" class="stat-val in">0 ₫</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">CHI THÁNG NÀY</span>
        <span id="monthExpense" class="stat-val out">0 ₫</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">SỐ DƯ HIỆN TẠI</span>
        <span id="totalBalance" class="stat-val bal">0 ₫</span>
      </div>
    </div>
  </div>

  <!-- THANH ĐIỀU HƯỚNG CHUẨN MẪU -->
  <div class="nav-bar">
    <div class="nav-left">
      <button type="button" class="nav-icon-btn" onclick="changeMonth(-1)" title="Tháng trước">‹</button>
      <div class="month-title" id="monthLabel">Tháng 11 / 2026</div>
      <button type="button" class="nav-icon-btn" onclick="changeMonth(1)" title="Tháng sau">›</button>
      <button type="button" class="today-pill-btn" onclick="goToday()">Tháng này</button>
      <button type="button" class="nav-icon-btn" id="refreshBtn" onclick="manualRefresh()" title="Làm mới">⟳</button>
    </div>

    <div class="nav-right">
      <div class="view-tabs">
        <button type="button" class="view-tab active" id="tabCalendar" onclick="switchView('calendar')">📅 Lịch tháng</button>
        <button type="button" class="view-tab" id="tabList" onclick="switchView('list')">☰ Danh sách</button>
        <button type="button" class="view-tab" id="tabStats" onclick="switchView('stats')">📊 Thống kê</button>
      </div>
      <button type="button" class="nav-icon-btn" onclick="exportCsv()" title="Xuất file CSV">⬇</button>
    </div>
  </div>

  <!-- CHẾ ĐỘ 1: LỊCH THÁNG -->
  <div id="viewCalendar">
    <div class="calendar-card" id="calendarCard">
      <div class="cal-weekdays">
        <div class="cal-weekday">THỨ 2</div>
        <div class="cal-weekday">THỨ 3</div>
        <div class="cal-weekday">THỨ 4</div>
        <div class="cal-weekday">THỨ 5</div>
        <div class="cal-weekday">THỨ 6</div>
        <div class="cal-weekday weekend">THỨ 7</div>
        <div class="cal-weekday weekend">CHỦ NHẬT</div>
      </div>
      <div id="calendarGrid" class="cal-grid"></div>
    </div>

    <!-- Chi tiết ngày đang chọn trên lịch -->
    <div class="day-detail-card">
      <div class="detail-header">
        <div class="detail-title">
          <span id="selectedDayTitle">Chi tiết ngày</span>
        </div>
        <div class="detail-badges" id="selectedDayTotals"></div>
      </div>
      <div id="selectedDayList"></div>
    </div>
  </div>

  <!-- CHẾ ĐỘ 2: DANH SÁCH GIAO DỊCH TRONG THÁNG -->
  <div id="viewList" class="view-card" style="display:none">
    <div class="filter-bar">
      <input id="searchInput" class="input-field" style="flex:1;min-width:200px"
             placeholder="Tìm theo nội dung hoặc danh mục..." oninput="renderListView()">
      <select id="categorySelect" class="input-field" onchange="renderListView()">
        <option value="">Tất cả danh mục</option>
      </select>
    </div>
    <div id="fullMonthList"></div>
  </div>

  <!-- CHẾ ĐỘ 3: THỐNG KÊ THÁNG -->
  <div id="viewStats" class="view-card" style="display:none">
    <div class="stats-grid">
      <div>
        <div style="font-weight:800;font-size:15px;margin-bottom:12px">Chi tiêu theo danh mục</div>
        <div id="categoryBreakdown"></div>
      </div>
      <div class="kpi-grid">
        <div class="kpi-box">
          <div class="kpi-label">TRUNG BÌNH CHI / NGÀY</div>
          <div class="kpi-val" id="statAvgDay">0 ₫</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-label">KHOẢN CHI LỚN NHẤT</div>
          <div class="kpi-val" id="statMaxExpense">0 ₫</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-label">SỐ GIAO DỊCH THÁNG</div>
          <div class="kpi-val" id="statTxCount">0</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-label">CHÊNH LỆCH THU - CHI</div>
          <div class="kpi-val" id="statNetMonth">0 ₫</div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- MODAL SỬA GIAO DỊCH -->
<div class="modal-overlay" id="editModal" onclick="if(event.target.id==='editModal') closeEditModal()">
  <form class="modal" onsubmit="event.preventDefault(); saveEdit();">
    <div class="modal-title">Sửa giao dịch</div>
    <div class="field">
      <label>Loại giao dịch</label>
      <div class="type-switch">
        <button type="button" class="type-opt chi" id="btnTypeChi" onclick="setEditType('Chi')">Chi tiêu</button>
        <button type="button" class="type-opt thu" id="btnTypeThu" onclick="setEditType('Thu')">Thu nhập</button>
      </div>
    </div>
    <div class="field">
      <label>Số tiền (₫)</label>
      <input type="number" id="editAmount" class="input-field" min="1" step="any" required>
    </div>
    <div class="field">
      <label>Danh mục</label>
      <select id="editCategory" class="input-field"></select>
    </div>
    <div class="field">
      <label>Nội dung</label>
      <input type="text" id="editNote" class="input-field" required>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="closeEditModal()">Hủy (Esc)</button>
      <button type="submit" id="saveEditBtn" class="btn-primary">Lưu thay đổi</button>
    </div>
  </form>
</div>

<div id="toast" class="toast"></div>

<script>
'use strict';

const CATEGORY_MAP = {
  'Ăn uống': { icon: '🍜', color: '#f97316' },
  'Cà phê & đồ uống': { icon: '☕', color: '#d97706' },
  'Di chuyển': { icon: '🚗', color: '#3b82f6' },
  'Nhà ở': { icon: '🏠', color: '#22c55e' },
  'Hóa đơn': { icon: '🧾', color: '#ef4444' },
  'Sức khỏe': { icon: '💊', color: '#ec4899' },
  'Mua sắm': { icon: '🛍️', color: '#a855f7' },
  'Học tập': { icon: '📚', color: '#06b6d4' },
  'Giải trí': { icon: '🎮', color: '#eab308' },
  'Gia đình': { icon: '👨‍👩‍👧', color: '#6366f1' },
  'Đầu tư': { icon: '📈', color: '#10b981' },
  'Quà tặng': { icon: '🎁', color: '#f43f5e' },
  'Lương': { icon: '💰', color: '#10b981' },
  'Thưởng': { icon: '🎉', color: '#f59e0b' },
  'Thu nhập khác': { icon: '💵', color: '#34d399' },
  'Khác': { icon: '💸', color: '#94a3b8' }
};

const EXPENSE_CATEGORIES = ['Ăn uống','Cà phê & đồ uống','Di chuyển','Nhà ở','Hóa đơn','Sức khỏe','Mua sắm','Học tập','Giải trí','Gia đình','Đầu tư','Quà tặng','Khác'];
const INCOME_CATEGORIES = ['Lương','Thưởng','Thu nhập khác','Đầu tư'];
const WEEKDAYS_FULL = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];

const NF = new Intl.NumberFormat('vi-VN');
const DF_TIME = new Intl.DateTimeFormat('vi-VN', { hour: '2-digit', minute: '2-digit' });

let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth();
let selectedDateKey = toDateKey(new Date());
let currentView = 'calendar';

let monthTransactions = [];
let monthCache = Object.create(null);
let activeRequestId = 0;
let editingId = null;
let editingType = 'Chi';
let toastTimer = null;

function toDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatMoney(v) {
  return NF.format(Math.round(Number(v) || 0)) + ' ₫';
}

function formatCompact(v) {
  const n = Math.abs(Number(v) || 0);
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'tỷ';
  if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 1).replace(/\.0$/, '') + 'tr';
  if (n >= 1e3) return Math.round(n / 1e3) + 'k';
  return n + 'đ';
}

function getCatInfo(cat) {
  return CATEGORY_MAP[cat] || CATEGORY_MAP['Khác'];
}

function switchView(view) {
  currentView = view;
  document.getElementById('tabCalendar').classList.toggle('active', view === 'calendar');
  document.getElementById('tabList').classList.toggle('active', view === 'list');
  document.getElementById('tabStats').classList.toggle('active', view === 'stats');

  document.getElementById('viewCalendar').style.display = view === 'calendar' ? 'block' : 'none';
  document.getElementById('viewList').style.display = view === 'list' ? 'block' : 'none';
  document.getElementById('viewStats').style.display = view === 'stats' ? 'block' : 'none';
  renderAll();
}

function changeMonth(delta) {
  const d = new Date(viewYear, viewMonth + delta, 1);
  viewYear = d.getFullYear();
  viewMonth = d.getMonth();

  const today = new Date();
  if (viewYear === today.getFullYear() && viewMonth === today.getMonth()) {
    selectedDateKey = toDateKey(today);
  } else {
    selectedDateKey = toDateKey(new Date(viewYear, viewMonth, 1));
  }
  loadMonthData(false);
}

function goToday() {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  selectedDateKey = toDateKey(now);
  loadMonthData(false);
}

function manualRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  const key = `${viewYear}-${viewMonth}`;
  delete monthCache[key];

  google.script.run
    .withSuccessHandler(res => {
      if (res) document.getElementById('totalBalance').textContent = formatMoney(res.balance);
    })
    .recalculateBalance();

  loadMonthData(true, () => btn.classList.remove('spinning'));
}

function loadBalance() {
  google.script.run
    .withSuccessHandler(res => {
      if (res) document.getElementById('totalBalance').textContent = formatMoney(res.balance);
    })
    .getBalance();
}

function loadMonthData(force, onDone) {
  document.getElementById('monthLabel').textContent = `Tháng ${String(viewMonth + 1).padStart(2, '0')} / ${viewYear}`;
  const cacheKey = `${viewYear}-${viewMonth}`;

  if (!force && monthCache[cacheKey]) {
    monthTransactions = monthCache[cacheKey];
    populateCategoryFilter();
    renderAll();
    if (onDone) onDone();
    return;
  }

  const requestId = ++activeRequestId;
  const calCard = document.getElementById('calendarCard');
  if (calCard) calCard.classList.add('is-loading');

  const start = new Date(viewYear, viewMonth, 1, 0, 0, 0);
  const end = new Date(viewYear, viewMonth + 1, 1, 0, 0, 0);

  google.script.run
    .withSuccessHandler(rows => {
      const list = Array.isArray(rows) ? rows : [];
      monthCache[cacheKey] = list;
      // Chống Race Condition: Bỏ qua nếu người dùng đã chuyển sang tháng khác
      if (requestId !== activeRequestId) return;
      if (calCard) calCard.classList.remove('is-loading');
      monthTransactions = list;
      populateCategoryFilter();
      renderAll();
      if (onDone) onDone();
    })
    .withFailureHandler(err => {
      if (requestId !== activeRequestId) return;
      if (calCard) calCard.classList.remove('is-loading');
      showToast(err.message || 'Không tải được dữ liệu tháng', true);
      if (onDone) onDone();
    })
    .getTransactionsInRange(start.toISOString(), end.toISOString());
}

function submitQuickInput() {
  const input = document.getElementById('quickInput');
  const btn = document.getElementById('quickBtn');
  const text = input.value.trim();
  if (!text || btn.disabled) return;

  input.disabled = true;
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(res => {
      input.value = '';
      input.disabled = false;
      btn.disabled = false;
      showToast(`Đã lưu: ${res.type} ${formatMoney(res.amount)} (${res.category})`);

      const d = new Date(res.timestamp);
      const key = `${d.getFullYear()}-${d.getMonth()}`;

      if (d.getFullYear() === viewYear && d.getMonth() === viewMonth) {
        monthTransactions = [...monthTransactions, res];
        monthCache[key] = monthTransactions;
        selectedDateKey = toDateKey(d);
        populateCategoryFilter();
        renderAll();
      } else {
        delete monthCache[key];
      }
      loadBalance();
      input.focus();
    })
    .withFailureHandler(err => {
      input.disabled = false;
      btn.disabled = false;
      showToast(err.message || 'Không thể lưu giao dịch', true);
      input.focus();
    })
    .addTransaction(text);
}

function renderAll() {
  let income = 0, expense = 0;
  monthTransactions.forEach(t => {
    const amt = Number(t.amount) || 0;
    if (t.type === 'Thu') income += amt; else expense += amt;
  });

  document.getElementById('monthIncome').textContent = (income > 0 ? '+' : '') + formatMoney(income);
  document.getElementById('monthExpense').textContent = (expense > 0 ? '-' : '') + formatMoney(expense);

  renderCalendarGrid();
  renderSelectedDayDetail();
  if (currentView === 'list') renderListView();
  if (currentView === 'stats') renderStatsView(income, expense);
}

function renderCalendarGrid() {
  const grid = document.getElementById('calendarGrid');
  const byDay = Object.create(null);

  monthTransactions.forEach(t => {
    const d = new Date(t.timestamp);
    if (isNaN(d.getTime())) return;
    const k = toDateKey(d);
    if (!byDay[k]) byDay[k] = { income: 0, expense: 0, count: 0 };
    const amt = Number(t.amount) || 0;
    if (t.type === 'Thu') byDay[k].income += amt; else byDay[k].expense += amt;
    byDay[k].count++;
  });

  const firstDay = new Date(viewYear, viewMonth, 1);
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const startOffset = (firstDay.getDay() + 6) % 7; // Thứ 2 = 0 ... CN = 6
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  const gridStartDate = new Date(viewYear, viewMonth, 1 - startOffset);
  const todayKey = toDateKey(new Date());

  const cellsHtml = [];
  for (let i = 0; i < totalCells; i++) {
    const cellDate = new Date(gridStartDate.getFullYear(), gridStartDate.getMonth(), gridStartDate.getDate() + i);
    const key = toDateKey(cellDate);
    const isCurrentMonth = cellDate.getMonth() === viewMonth;
    const isToday = key === todayKey;
    const isSelected = key === selectedDateKey;
    const data = byDay[key];

    const classes = ['cal-cell'];
    if (!isCurrentMonth) classes.push('other-month');
    if (isToday) classes.push('today');
    if (isSelected) classes.push('selected');

    let pillsHtml = '';
    if (data) {
      const pills = [];
      if (data.expense > 0) {
        pills.push(`<div class="day-pill chi"><span class="dot"></span>-${formatCompact(data.expense)}</div>`);
      }
      if (data.income > 0) {
        pills.push(`<div class="day-pill thu"><span class="dot"></span>+${formatCompact(data.income)}</div>`);
      }
      pillsHtml = `<div class="cell-pills">${pills.join('')}</div>`;
    }

    cellsHtml.push(`
      <div class="${classes.join(' ')}"
           data-date-key="${key}"
           data-year="${cellDate.getFullYear()}"
           data-month="${cellDate.getMonth()}">
        <div class="cell-top">
          <span class="day-num">${cellDate.getDate()}</span>
          ${data && data.count > 1 ? `<span class="cell-count">${data.count} mục</span>` : ''}
        </div>
        ${pillsHtml}
      </div>
    `);
  }

  grid.innerHTML = cellsHtml.join('');
}

function renderSelectedDayDetail() {
  const [y, m, d] = selectedDateKey.split('-').map(Number);
  const dateObj = new Date(y, m - 1, d);
  const todayKey = toDateKey(new Date());

  const titlePrefix = selectedDateKey === todayKey ? 'Hôm nay · ' : '';
  document.getElementById('selectedDayTitle').textContent =
    `${titlePrefix}${WEEKDAYS_FULL[dateObj.getDay()]}, ${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;

  const list = monthTransactions
    .filter(t => toDateKey(new Date(t.timestamp)) === selectedDateKey)
    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  let inc = 0, exp = 0;
  list.forEach(t => {
    const a = Number(t.amount) || 0;
    if (t.type === 'Thu') inc += a; else exp += a;
  });

  document.getElementById('selectedDayTotals').innerHTML = [
    inc ? `<span class="in">+${formatMoney(inc)}</span>` : '',
    exp ? `<span class="out">-${formatMoney(exp)}</span>` : ''
  ].join('') || '<span style="color:var(--muted);font-weight:600">0 ₫</span>';

  const container = document.getElementById('selectedDayList');
  if (!list.length) {
    container.innerHTML = '<div class="empty">Chưa có giao dịch nào trong ngày này.</div>';
    return;
  }
  container.innerHTML = list.map(renderTxRowHtml).join('');
}

function renderTxRowHtml(item) {
  const d = new Date(item.timestamp);
  const isThu = item.type === 'Thu';
  const info = getCatInfo(item.category);
  const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} · ${DF_TIME.format(d)}`;
  const safeId = escapeHtml(item.id);

  return `
    <div class="tx-row" data-tx-id="${safeId}">
      <div class="tx-left" data-action="edit">
        <div class="tx-icon" style="background:${info.color}22;color:${info.color}">${info.icon}</div>
        <div style="min-width:0">
          <div class="tx-note">${escapeHtml(item.note)}</div>
          <div class="tx-meta">
            <span>${dateStr}</span>
            <span class="tx-tag">${escapeHtml(item.category || 'Khác')}</span>
          </div>
        </div>
      </div>
      <div class="tx-right">
        <div class="tx-amount ${isThu ? 'thu' : 'chi'}">${isThu ? '+' : '-'}${formatMoney(item.amount)}</div>
        <button type="button" class="act-btn" title="Sửa" data-action="edit">✎</button>
        <button type="button" class="act-btn del" title="Xóa" data-action="delete">✕</button>
      </div>
    </div>`;
}

function populateCategoryFilter() {
  const select = document.getElementById('categorySelect');
  const current = select.value;
  const cats = [...new Set(monthTransactions.map(t => t.category).filter(Boolean))];
  select.innerHTML = '<option value="">Tất cả danh mục</option>' +
    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  if (cats.includes(current)) select.value = current;
}

function renderListView() {
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const cat = document.getElementById('categorySelect').value;

  const filtered = monthTransactions
    .filter(t => (!cat || t.category === cat) &&
      (!q || (t.note || '').toLowerCase().includes(q) || (t.category || '').toLowerCase().includes(q)))
    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  const container = document.getElementById('fullMonthList');
  if (!filtered.length) {
    container.innerHTML = '<div class="empty">Không tìm thấy giao dịch phù hợp trong tháng này.</div>';
    return;
  }
  container.innerHTML = filtered.map(renderTxRowHtml).join('');
}

function renderStatsView(income, expense) {
  const byCat = Object.create(null);
  let maxExp = 0;
  const activeDays = new Set();

  monthTransactions.forEach(t => {
    const amt = Number(t.amount) || 0;
    if (t.type !== 'Thu') {
      const c = t.category || 'Khác';
      byCat[c] = (byCat[c] || 0) + amt;
      if (amt > maxExp) maxExp = amt;
      activeDays.add(toDateKey(new Date(t.timestamp)));
    }
  });

  const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const catContainer = document.getElementById('categoryBreakdown');

  if (!entries.length) {
    catContainer.innerHTML = '<div class="empty">Chưa có khoản chi nào trong tháng.</div>';
  } else {
    const topVal = entries[0][1] || 1;
    catContainer.innerHTML = entries.map(([cat, amt]) => {
      const info = getCatInfo(cat);
      const pct = Math.max(4, Math.round((amt / topVal) * 100));
      const share = expense > 0 ? Math.round((amt / expense) * 100) : 0;
      return `
        <div class="cat-row">
          <div class="tx-icon" style="background:${info.color}22;color:${info.color}">${info.icon}</div>
          <div>
            <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700">
              <span>${escapeHtml(cat)}</span>
              <span style="color:var(--muted-light);font-size:11.5px">${share}%</span>
            </div>
            <div class="cat-bar"><div class="cat-fill" style="width:${pct}%"></div></div>
          </div>
          <div style="font-size:13px;font-weight:800">${formatMoney(amt)}</div>
        </div>`;
    }).join('');
  }

  const daysCount = Math.max(activeDays.size, 1);
  document.getElementById('statAvgDay').textContent = formatMoney(expense / daysCount);
  document.getElementById('statMaxExpense').textContent = formatMoney(maxExp);
  document.getElementById('statTxCount').textContent = monthTransactions.length;

  const net = income - expense;
  const netEl = document.getElementById('statNetMonth');
  netEl.textContent = (net >= 0 ? '+' : '-') + formatMoney(Math.abs(net));
  netEl.style.color = net >= 0 ? 'var(--green)' : 'var(--red)';
}

function removeTx(id) {
  const idx = monthTransactions.findIndex(t => t.id === id);
  if (idx === -1) return;
  const backup = monthTransactions[idx];
  const cacheKey = `${viewYear}-${viewMonth}`;

  monthTransactions = monthTransactions.filter(t => t.id !== id);
  monthCache[cacheKey] = monthTransactions;
  renderAll();

  google.script.run
    .withSuccessHandler(res => {
      if (!res || !res.success) {
        monthTransactions.splice(idx, 0, backup);
        monthCache[cacheKey] = monthTransactions;
        renderAll();
        showToast('Không xóa được giao dịch', true);
        return;
      }
      loadBalance();
      showToast(`Đã xóa "${backup.note}"`);
    })
    .withFailureHandler(err => {
      monthTransactions.splice(idx, 0, backup);
      monthCache[cacheKey] = monthTransactions;
      renderAll();
      showToast(err.message || 'Lỗi khi xóa', true);
    })
    .deleteTransaction(id);
}

function setEditType(type) {
  editingType = type;
  document.getElementById('btnTypeChi').classList.toggle('active', type === 'Chi');
  document.getElementById('btnTypeThu').classList.toggle('active', type === 'Thu');
  const list = type === 'Thu' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  document.getElementById('editCategory').innerHTML =
    list.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
}

function openEditModal(id) {
  const item = monthTransactions.find(t => t.id === id);
  if (!item) return;
  editingId = id;
  setEditType(item.type === 'Thu' ? 'Thu' : 'Chi');
  document.getElementById('editAmount').value = item.amount;
  document.getElementById('editNote').value = item.note;
  document.getElementById('editCategory').value = item.category;
  document.getElementById('editModal').classList.add('show');
  document.getElementById('editAmount').focus();
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  editingId = null;
}

function saveEdit() {
  if (!editingId) return;
  const saveBtn = document.getElementById('saveEditBtn');
  if (saveBtn.disabled) return;

  const amount = Number(document.getElementById('editAmount').value);
  const category = document.getElementById('editCategory').value;
  const note = document.getElementById('editNote').value.trim();

  if (!amount || amount <= 0) return showToast('Số tiền không hợp lệ', true);
  if (!note) return showToast('Vui lòng nhập nội dung', true);

  const id = editingId;
  const cacheKey = `${viewYear}-${viewMonth}`;
  saveBtn.disabled = true;
  saveBtn.textContent = 'Đang lưu...';

  google.script.run
    .withSuccessHandler(updated => {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Lưu thay đổi';
      monthTransactions = monthTransactions.map(t => t.id === id ? updated : t);
      monthCache[cacheKey] = monthTransactions;
      closeEditModal();
      loadBalance();
      populateCategoryFilter();
      renderAll();
      showToast('Đã cập nhật giao dịch');
    })
    .withFailureHandler(err => {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Lưu thay đổi';
      showToast(err.message || 'Lỗi cập nhật', true);
    })
    .updateTransaction(id, { type: editingType, amount: Math.round(amount), category, note });
}

function exportCsv() {
  if (!monthTransactions.length) return showToast('Tháng này chưa có giao dịch để xuất', true);
  const header = ['Thời gian','Loại','Số tiền','Danh mục','Nội dung'];
  const rows = [...monthTransactions]
    .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp))
    .map(t => [new Date(t.timestamp).toLocaleString('vi-VN'), t.type, t.amount, t.category, t.note || '']);

  const csv = [header, ...rows]
    .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
    .join('\r\n');

  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `chi-tieu-${viewYear}-${String(viewMonth + 1).padStart(2, '0')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`Đã xuất ${monthTransactions.length} giao dịch`);
}

function showToast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('error', !!isErr);
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s ?? '');
  return d.innerHTML;
}

// ===== EVENT DELEGATION CHUẨN SENIOR (KHÔNG DÙNG INLINE ONCLICK ĐỘNG) =====
document.getElementById('calendarGrid').addEventListener('click', e => {
  const cell = e.target.closest('.cal-cell');
  if (!cell) return;
  const key = cell.dataset.dateKey;
  const y = Number(cell.dataset.year);
  const m = Number(cell.dataset.month);
  selectedDateKey = key;
  if (y !== viewYear || m !== viewMonth) {
    viewYear = y;
    viewMonth = m;
    loadMonthData(false);
    return;
  }
  renderCalendarGrid();
  renderSelectedDayDetail();
});

function handleTxListClick(e) {
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  const row = actionEl.closest('[data-tx-id]');
  if (!row) return;
  const txId = row.dataset.txId;
  if (actionEl.dataset.action === 'edit') {
    openEditModal(txId);
  } else if (actionEl.dataset.action === 'delete') {
    removeTx(txId);
  }
}

document.getElementById('selectedDayList').addEventListener('click', handleTxListClick);
document.getElementById('fullMonthList').addEventListener('click', handleTxListClick);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('editModal').classList.contains('show')) {
    closeEditModal();
  }
});

loadBalance();
loadMonthData(false);
</script>
</body>
</html>
